<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Daily Deals Inventory Management System</title>
    <link rel="stylesheet" href="shared/styles/main.css">
    <link rel="stylesheet" href="shared/styles/dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-store"></i>
                <h1>Daily Deals</h1>
                <span class="subtitle">Inventory System</span>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html" class="nav-item active">
                    <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
                </a>
                <a href="products.html" class="nav-item">
                    <i class="fas fa-boxes"></i> <span>Products</span>
                </a>
                <a href="sales.html" class="nav-item">
                    <i class="fas fa-cash-register"></i> <span>Sales</span>
                </a>
                <a href="purchases.html" class="nav-item">
                    <i class="fas fa-shopping-cart"></i> <span>Purchases</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="fas fa-warehouse"></i> <span>Inventory</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> <span>Reports</span>
                </a>
                <a href="suppliers.html" class="nav-item">
                    <i class="fas fa-truck"></i> <span>Suppliers</span>
                </a>
                <a href="login.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content Wrapper -->
        <div class="content-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>Admin User</span>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="dashboard-grid">
                    <div class="card stats-card">
                        <div class="card-header">
                            <i class="fas fa-boxes"></i>
                            <h3>Total Products</h3>
                        </div>
                        <div class="card-body">
                            <span class="stat-number" id="totalProducts">0</span>
                        </div>
                    </div>
                    
                    <div class="card stats-card">
                        <div class="card-header">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Low Stock Alerts</h3>
                        </div>
                        <div class="card-body">
                            <span class="stat-number alert" id="lowStockCount">0</span>
                        </div>
                    </div>
                    
                    <div class="card stats-card">
                        <div class="card-header">
                            <i class="fas fa-chart-line"></i>
                            <h3>Today's Sales</h3>
                        </div>
                        <div class="card-body">
                            <span class="stat-number">NPR <span id="todaySales">0</span></span>
                        </div>
                    </div>
                    
                    <div class="card stats-card">
                        <div class="card-header">
                            <i class="fas fa-shopping-cart"></i>
                            <h3>Today's Purchases</h3>
                        </div>
                        <div class="card-body">
                            <span class="stat-number">NPR <span id="todayPurchases">0</span></span>
                        </div>
                    </div>
                </div>

                <div class="dashboard-bottom">
                    <div class="card">
                        <div class="card-header">
                            <h3>Recent Alerts</h3>
                        </div>
                        <div class="card-body">
                            <div id="alertsList" class="alerts-list">
                                <!-- Alerts will be populated here -->
                            </div>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="card-header">
                            <h3>Quick Actions</h3>
                        </div>
                        <div class="card-body">
                            <div class="quick-actions">
                                <button class="btn btn-primary" onclick="window.location.href='purchases.html'">
                                    <i class="fas fa-plus"></i> New Purchase
                                </button>
                                <button class="btn btn-success" onclick="window.location.href='sales.html'">
                                    <i class="fas fa-cash-register"></i> New Sale
                                </button>
                                <button class="btn btn-info" onclick="window.location.href='products.html'">
                                    <i class="fas fa-box"></i> Add Product
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <i id="toast-icon" class="fas"></i>
            <div class="toast-message" id="toast-message"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="shared/js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
