<!-- MartMS -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Deals - Inventory Management System</title>
    <link rel="stylesheet" href="../shared/styles/main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Page specific CSS will be included here -->
    {{PAGE_SPECIFIC_CSS}}
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-store"></i>
                <h1>Daily Deals</h1>
                <span class="subtitle">Inventory System</span>
            </div>
            <nav class="side-nav">
                <a href="../dashboard.html" class="nav-item" id="nav-dashboard">
                    <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
                </a>
                <a href="../products.html" class="nav-item" id="nav-products">
                    <i class="fas fa-boxes"></i> <span>Products</span>
                </a>
                <a href="../sales.html" class="nav-item" id="nav-sales">
                    <i class="fas fa-cash-register"></i> <span>Sales</span>
                </a>
                <a href="../purchases.html" class="nav-item" id="nav-purchase">
                    <i class="fas fa-shopping-cart"></i> <span>Purchases</span>
                </a>
                <a href="../inventory.html" class="nav-item" id="nav-inventory">
                    <i class="fas fa-warehouse"></i> <span>Inventory</span>
                </a>
                <a href="../reports.html" class="nav-item" id="nav-reports">
                    <i class="fas fa-chart-bar"></i> <span>Reports</span>
                </a>
                <a href="../suppliers.html" class="nav-item" id="nav-suppliers">
                    <i class="fas fa-truck"></i> <span>Suppliers</span>
                </a>
                <a href="../login.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content Wrapper -->
        <div class="content-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>Admin User</span>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                {{MAIN_CONTENT}}
            </main>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <i id="toast-icon" class="fas"></i>
            <div class="toast-message" id="toast-message"></div>
        </div>
    </div>

    <!-- Common Scripts -->
    <script src="../shared/js/common.js"></script>
    <!-- Page specific scripts will be included here -->
    {{PAGE_SPECIFIC_SCRIPTS}}
</body>
</html>
