<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Management - Daily Deals Inventory Management System</title>
    <link rel="stylesheet" href="shared/styles/main.css">
    <link rel="stylesheet" href="shared/styles/purchases.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-store"></i>
                <h1>Daily Deals</h1>
                <span class="subtitle">Inventory System</span>
            </div>
            <nav class="side-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i> <span>Dashboard</span>
                </a>
                <a href="products.html" class="nav-item">
                    <i class="fas fa-boxes"></i> <span>Products</span>
                </a>
                <a href="sales.html" class="nav-item">
                    <i class="fas fa-cash-register"></i> <span>Sales</span>
                </a>
                <a href="purchases.html" class="nav-item active">
                    <i class="fas fa-shopping-cart"></i> <span>Purchases</span>
                </a>
                <a href="inventory.html" class="nav-item">
                    <i class="fas fa-warehouse"></i> <span>Inventory</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i> <span>Reports</span>
                </a>
                <a href="suppliers.html" class="nav-item">
                    <i class="fas fa-truck"></i> <span>Suppliers</span>
                </a>
                <a href="login.html" class="nav-item logout">
                    <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                </a>
            </nav>
        </aside>
        
        <!-- Main Content Wrapper -->
        <div class="content-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span>Admin User</span>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="tab-header">
                    <h2>Purchase</h2>
                    <button class="btn btn-primary" onclick="showPurchaseModal()">
                        <i class="fas fa-plus"></i> Add New
                    </button>
                </div>

                <!-- Purchase Table -->
                <div class="card">
                    <div class="card-header">
                        <h3>Recent Purchases</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table id="purchasesTable" class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Supplier</th>
                                        <th>Product</th>
                                        <th>Quantity</th>
                                        <th>Unit Price</th>
                                        <th>Total Amount</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Purchase data will be populated here by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Pagination -->
                        <div class="pagination">
                            <button class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Previous
                            </button>
                            <span class="page-info">Page 1 of 3</span>
                            <button class="btn btn-secondary">
                                Next <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Purchase</h3>
                <span class="close" onclick="closePurchaseModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="purchaseForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="supplier">Supplier:</label>
                            <select id="supplier" name="supplier" required>
                                <option value="">Select Supplier</option>
                                <option value="1">ABC Supplier</option>
                                <option value="2">XYZ Distributors</option>
                                <option value="3">Global Traders</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="product">Product:</label>
                            <select id="product" name="product" required>
                                <option value="">Select Product</option>
                                <option value="1">Product A</option>
                                <option value="2">Product B</option>
                                <option value="3">Product C</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Quantity:</label>
                            <input type="number" id="quantity" name="quantity" min="1" required>
                        </div>

                        <div class="form-group">
                            <label for="unitPrice">Unit Price:</label>
                            <input type="number" id="unitPrice" name="unitPrice" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="totalAmount">Total Amount:</label>
                            <input type="number" id="totalAmount" name="totalAmount" step="0.01" readonly>
                        </div>

                        <div class="form-group">
                            <label for="purchaseDate">Purchase Date:</label>
                            <input type="date" id="purchaseDate" name="purchaseDate" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closePurchaseModal()">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Save Purchase
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <i id="toast-icon" class="fas"></i>
            <div class="toast-message" id="toast-message"></div>
        </div>
    </div>

    <script src="js/purchases.js"></script>
</body>
</html>
