<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Deals - Admin Login</title>
    <link rel="stylesheet" href="login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-store"></i>
                    <h1>Daily Deals</h1>
                    <p>Smarter Inventory. Seamless Control.</p>
                </div>
            </div>

            <!-- Login Form Section -->
            <div class="form-section">
                <div class="form-container">
                    <h2>Welcome, Admin</h2>
                    <p class="subtitle">Administrator access only</p>

                    <!-- Admin Login Form -->
                    <form id="adminLoginForm" class="login-form active">
                        <div class="form-group">
                            <label for="adminUsername">
                                <i class="fas fa-user"></i>
                                Username
                            </label>
                            <input type="text" id="adminUsername" name="username" required placeholder="Enter admin username">
                        </div>
                        
                        <div class="form-group">
                            <label for="adminPassword">
                                <i class="fas fa-lock"></i>
                                Password
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="adminPassword" name="password" required placeholder="Enter password">
                                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                                    <i class="far fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-meta">
                                <div class="password-strength" id="passwordStrength" aria-hidden="true">
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                    <span class="bar"></span>
                                </div>
                                <small class="caps-warning" id="capsWarning"><i class="fas fa-exclamation-triangle"></i> Caps Lock is on</small>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" id="rememberUsername">
                                <span class="checkmark"></span>
                                Remember username
                            </label>
                            <a href="#" class="forgot-link">Need help?</a>
                        </div>

                        <button type="submit" class="login-btn">
                            <i class="fas fa-sign-in-alt"></i>
                            Login as Admin
                        </button>

                        <div class="social-login">
                            <span>Sign in with</span>
                            <div class="social-icons">
                                <button type="button" id="facebookSignIn" class="social-btn facebook" aria-label="Continue with Facebook" title="Continue with Facebook"><i class="fab fa-facebook-f"></i></button>
                                <button type="button" id="googleSignIn" class="social-btn google" aria-label="Continue with Google" title="Continue with Google"><i class="fab fa-google"></i></button>
                                <button type="button" id="appleSignIn" class="social-btn apple" aria-label="Continue with Apple" title="Continue with Apple"><i class="fab fa-apple"></i></button>
                                <button type="button" id="microsoftSignIn" class="social-btn microsoft" aria-label="Continue with Microsoft" title="Continue with Microsoft"><i class="fab fa-microsoft"></i></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Background Elements -->
        <div class="floating-elements">
            <div class="floating-icon" style="--delay: 0s; --position: 10%">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="floating-icon" style="--delay: 2s; --position: 20%">
                <i class="fas fa-tags"></i>
            </div>
            <div class="floating-icon" style="--delay: 4s; --position: 70%">
                <i class="fas fa-gift"></i>
            </div>
            <div class="floating-icon" style="--delay: 6s; --position: 80%">
                <i class="fas fa-star"></i>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script type="module" src="login-script.js"></script>
</body>
</html>
