<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Deals - Login</title>
    <link rel="stylesheet" href="login-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
                    <i class="fas fa-store"></i>
                    <h1>Daily Deals</h1>
                    <p>Your One-Stop Shopping Destination</p>
                </div>
            </div>

            <!-- Login Form Section -->
            <div class="form-section">
                <div class="form-container">
                    <h2>Welcome to Daily Deals!</h2>
                    <p class="subtitle">Choose how you'd like to access Daily Deals</p>
                    
                    <!-- Role Selection -->
                    <div class="role-selector">
                        <button class="role-btn active" data-role="customer">
                            <i class="fas fa-shopping-bag"></i>
                            <span>Customer</span>
                            <small>Browse & Order Products</small>
                        </button>
                        <button class="role-btn" data-role="manager">
                            <i class="fas fa-user-tie"></i>
                            <span>Manager</span>
                            <small>Inventory Management</small>
                        </button>
                    </div>

                    <!-- Customer Login Form -->
                    <form id="customerLoginForm" class="login-form active">
                        <div class="form-group">
                            <label for="customerEmail">
                                <i class="fas fa-envelope"></i>
                                Email Address
                            </label>
                            <input type="email" id="customerEmail" name="email" required placeholder="Enter your email">
                        </div>
                        
                        <div class="form-group">
                            <label for="customerPassword">
                                <i class="fas fa-lock"></i>
                                Password
                            </label>
                            <input type="password" id="customerPassword" name="password" required placeholder="Enter your password">
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" name="remember">
                                <span class="checkmark"></span>
                                Remember me
                            </label>
                            <a href="#" class="forgot-link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="login-btn">
                            <i class="fas fa-sign-in-alt"></i>
                            Login as Customer
                        </button>

                        <div class="divider">
                            <span>or</span>
                        </div>

                        <button type="button" class="guest-btn" onclick="accessAsGuest()">
                            <i class="fas fa-user-clock"></i>
                            Continue as Guest
                        </button>

                        <div class="signup-link">
                            <p>Don't have an account? <a href="#" onclick="showSignupForm()">Sign up here</a></p>
                        </div>
                    </form>

                    <!-- Manager Login Form -->
                    <form id="managerLoginForm" class="login-form">
                        <div class="form-group">
                            <label for="managerUsername">
                                <i class="fas fa-user"></i>
                                Username
                            </label>
                            <input type="text" id="managerUsername" name="username" required placeholder="Enter username">
                        </div>
                        
                        <div class="form-group">
                            <label for="managerPassword">
                                <i class="fas fa-lock"></i>
                                Password
                            </label>
                            <input type="password" id="managerPassword" name="password" required placeholder="Enter password">
                        </div>

                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" name="remember">
                                <span class="checkmark"></span>
                                Remember me
                            </label>
                        </div>

                        <button type="submit" class="login-btn manager">
                            <i class="fas fa-sign-in-alt"></i>
                            Login as Manager
                        </button>

                        <div class="manager-info">
                            <p><i class="fas fa-info-circle"></i> Manager access requires proper credentials</p>
                        </div>
                    </form>

                    <!-- Signup Form -->
                    <form id="signupForm" class="login-form">
                        <h3>Create Account</h3>
                        <div class="form-group">
                            <label for="signupName">
                                <i class="fas fa-user"></i>
                                Full Name
                            </label>
                            <input type="text" id="signupName" name="name" required placeholder="Enter your full name">
                        </div>
                        
                        <div class="form-group">
                            <label for="signupEmail">
                                <i class="fas fa-envelope"></i>
                                Email Address
                            </label>
                            <input type="email" id="signupEmail" name="email" required placeholder="Enter your email">
                        </div>
                        
                        <div class="form-group">
                            <label for="signupPhone">
                                <i class="fas fa-phone"></i>
                                Phone Number
                            </label>
                            <input type="tel" id="signupPhone" name="phone" required placeholder="Enter your phone number">
                        </div>
                        
                        <div class="form-group">
                            <label for="signupPassword">
                                <i class="fas fa-lock"></i>
                                Password
                            </label>
                            <input type="password" id="signupPassword" name="password" required placeholder="Create a password">
                        </div>

                        <button type="submit" class="login-btn">
                            <i class="fas fa-user-plus"></i>
                            Create Account
                        </button>

                        <div class="signup-link">
                            <p>Already have an account? <a href="#" onclick="showLoginForm()">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Background Elements -->
        <div class="floating-elements">
            <div class="floating-icon" style="--delay: 0s; --position: 10%">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="floating-icon" style="--delay: 2s; --position: 20%">
                <i class="fas fa-tags"></i>
            </div>
            <div class="floating-icon" style="--delay: 4s; --position: 70%">
                <i class="fas fa-gift"></i>
            </div>
            <div class="floating-icon" style="--delay: 6s; --position: 80%">
                <i class="fas fa-star"></i>
            </div>
        </div>
    </div>

    <script src="login-script.js"></script>
</body>
</html>
